version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Database Service (Lightweight Alpine Image)
  # ============================================================================
  bambaura-db:
    image: postgres:16-alpine
    container_name: bambaura-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bambauradb
      POSTGRES_USER: bambaura_user
      POSTGRES_PASSWORD: bambaura_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - bambaura_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambaura_user -d bambauradb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bambaura-net

  # ============================================================================
  # 2. Bambaura Fullstack Application (.NET 10 Minimal APIs + Embedded React SPA)
  # ============================================================================
  bambaura-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bambaura-app
    restart: unless-stopped
    depends_on:
      bambaura-db:
        condition: service_healthy
    ports:
      - "80:5000"      # Directly serves Storefront & API to web traffic
      - "5000:5000"    # Direct API / development inspection port
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=5000
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=bambaura-db;Port=5432;Database=bambauradb;Username=bambaura_user;Password=bambaura_secure_password_2026;Include Error Detail=true
      - Razorpay__KeyId=rzp_test_bambaura_reserve
      - Razorpay__KeySecret=bambaura_master_secret_2026
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bambaura-net

volumes:
  bambaura_pg_data:
    driver: local

networks:
  bambaura-net:
    driver: bridge
